[project]
name = "flowpool"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "playwright>=1.48",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["flowpool*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
