[project]
name = "flowpool"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "playwright>=1.48",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["flowpool*"]

# O painel e servido de dentro do pacote, por caminho relativo a `flowpool/api/`. Sem
# esta linha, uma instalacao normal (nao editavel) copiaria so os .py e o `GET /` cairia
# em 404 num ambiente que passa em todos os testes.
[tool.setuptools.package-data]
flowpool = ["api/painel.html", "api/painel.css", "api/painel.js", "dados/esquema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
